[package]
name = "fast-m2"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
